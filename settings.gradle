EOFcat > app/src/main/java/com/etsa/aicreator/MainActivity.java <<'EOF'
package com.etsa.aicreator;

import android.app.Activity;
import android.os.Bundle;
import android.widget.Button;
import android.widget.EditText;
import android.widget.TextView;

public class MainActivity extends Activity {

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(com.etsa.aicreator.R.layout.activity_main);

        EditText promptInput = findViewById(R.id.promptInput);
        Button createButton = findViewById(R.id.createButton);
        TextView outputText = findViewById(R.id.outputText);

        createButton.setOnClickListener(v -> {
            String prompt = promptInput.getText().toString().trim();

            if (prompt.isEmpty()) {
                outputText.setText("Describe a game first.");
                return;
            }

            String result =
                    "GAME CREATION PLAN\n\n" +
                    "Prompt:\n" + prompt + "\n\n" +
                    "Creator status:\n" +
                    "• Android app running locally\n" +
                    "• Internet capability enabled\n" +
                    "• Project system ready\n" +
                    "• AI coding connection will be added next\n" +
                    "• Web research and image-reference search will be added next\n\n" +
                    "This confirms the APK foundation is working.";

            outputText.setText(result);
        });
    }
}
EOFcat > .github/workflows/build-apk.yml <<'EOF'
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: etsa-ai-game-creator-apk
          path: app/build/outputs/apk/debug/app-debug.apk
